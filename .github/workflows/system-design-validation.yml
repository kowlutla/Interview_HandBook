name: System Design Textbook Validation

on:
  push:
    paths:
      - "system-design-mastery/**"
      - ".github/workflows/system-design-validation.yml"
  pull_request:
    paths:
      - "system-design-mastery/**"
      - ".github/workflows/system-design-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-and-openapi:
    name: Structural and OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenAPI validator
        run: python -m pip install --upgrade pip openapi-spec-validator PyYAML
      - name: Extract diagrams and OpenAPI example
        run: python system-design-mastery/scripts/validate_artifacts.py /tmp/system-design-artifacts
      - name: Validate OpenAPI 3.1 document
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/system-design-artifacts/openapi/*.yaml)
          test "${#files[@]}" -eq 1
          for spec in "${files[@]}"; do
            echo "Validating $spec"
            openapi-spec-validator "$spec"
          done

  mermaid-render:
    name: Render every Mermaid diagram
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract diagrams
        run: python system-design-mastery/scripts/validate_artifacts.py /tmp/system-design-artifacts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli
      - name: Render all Mermaid files to SVG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/system-design-artifacts/rendered
          count=0
          while IFS= read -r -d '' diagram; do
            count=$((count + 1))
            output="/tmp/system-design-artifacts/rendered/$(basename "${diagram%.mmd}").svg"
            echo "Rendering $diagram"
            mmdc -i "$diagram" -o "$output"
          done < <(find /tmp/system-design-artifacts/mermaid -type f -name '*.mmd' -print0)
          test "$count" -eq 29
          test "$(find /tmp/system-design-artifacts/rendered -type f -name '*.svg' | wc -l)" -eq 29
      - name: Upload rendered diagrams for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-design-mermaid-rendered
          path: /tmp/system-design-artifacts/rendered/
          if-no-files-found: ignore
