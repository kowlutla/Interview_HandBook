name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout DSA source repository
        uses: actions/checkout@v4
        with:
          repository: kowlutla/DSA
          path: dsa-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -I tools/build_site.py && python -I tools/build_search.py
      - run: python -I tools/check_site.py && python -I tools/check_dsa.py site/dsa/topics/strings.html site/dsa/topics/strings/isomorphic-strings.html site/dsa/topics/strings/minimum-number-following-pattern.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
