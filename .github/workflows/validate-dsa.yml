name: Validate DSA integration

on:
  push:
    branches: [feature/dsa-integration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout DSA source repository
        uses: actions/checkout@v4
        with:
          repository: kowlutla/DSA
          path: dsa-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build navigation and search index
        run: python -I tools/build_site.py && python -I tools/build_search.py
      - name: Validate all site links
        run: python -I tools/check_site.py
      - name: Validate DSA topic structure
        run: python -I tools/check_dsa.py $(find site/dsa/topics -name '*.html' -print)
