<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search | Interview Prep</title>
<link rel="stylesheet" href="handbook/assets/style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
body{background:var(--bg)}
.sx-bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.sx-bar .in{max-width:900px;margin:0 auto;padding:14px 22px 12px}
.sx-nav{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin-bottom:10px;align-items:center}
.sx-nav a{color:var(--muted);text-decoration:none}
.sx-nav a:hover{color:var(--accent)}
.sx-nav .home{font-weight:700;color:var(--fg)}
.sx-box{position:relative}
.sx-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.sx-box input{width:100%;font:inherit;font-size:1.15rem;line-height:1.3;padding:13px 48px 13px 44px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);outline:none;transition:border-color .15s,box-shadow .15s}
.sx-box input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sx-box kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:inherit;font-size:12px;line-height:1;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--bg)}
.sx-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sx-chips button{font:inherit;font-size:13.5px;line-height:1;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.sx-chips button:hover{border-color:var(--accent)}
.sx-chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sx-chips button span{opacity:.75;margin-left:5px}
.sx-main{max-width:900px;margin:0 auto;padding:18px 22px 100px}
.sx-meta{color:var(--muted);font-size:14px;margin:0 0 14px}
.sx-hit{display:block;text-decoration:none;color:var(--fg);padding:14px 16px;margin:0 0 10px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:12px;background:var(--card);transition:transform .08s,border-color .12s,box-shadow .12s}
.sx-hit:hover,.sx-hit.sel{border-color:var(--accent);border-left-color:var(--c,var(--accent));box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
.sx-hit .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.sx-hit .tag{font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:11px;color:var(--c,var(--accent))}
.sx-hit .ttl{display:block;font-size:1.08rem;font-weight:650;line-height:1.35;margin:4px 0 4px}
.sx-hit .snip{display:block;color:var(--muted);font-size:14.5px;line-height:1.55}
.sx-hit mark{background:var(--warn-soft);color:var(--fg);border-radius:3px;padding:0 2px;font-weight:600}
.sx-hit.handbook{--c:var(--accent)}
.sx-hit.quick{--c:var(--good)}
.sx-hit.interview{--c:var(--tip)}
.sx-empty{text-align:center;color:var(--muted);padding:48px 12px}
.sx-empty h2{color:var(--fg);margin:0 0 8px;font-size:1.3rem}
.sx-empty h2::after{display:none}
.sx-sug{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.sx-sug button{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.sx-sug button:hover{border-color:var(--accent);color:var(--accent)}
.sx-more{display:block;margin:6px auto 0;font:inherit;padding:10px 20px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.sx-more:hover{border-color:var(--accent)}
@media (max-width:560px){.sx-box kbd{display:none}.sx-box input{font-size:1.02rem}}
</style>
</head>
<body data-page="search">
<header class="sx-bar"><div class="in">
  <nav class="sx-nav" aria-label="Site sections">
    <a class="home" href="index.html">&larr; Interview Prep</a>
    <a href="handbook/index.html">Handbook</a>
    <a href="quicknotes/index.html">Quick Notes</a>
    <a href="interview/index.html">Interview Book</a>
    <a href="dsa/index.html">DSA</a>
    <a href="handbook/reference/ref-glossary.html">Glossary</a>
  </nav>
  <div class="sx-box">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search chapters, case studies, quick sheets and interview questions" aria-label="Search">
    <kbd id="hint">/</kbd>
  </div>
  <div class="sx-chips" id="chips" role="group" aria-label="Filter by section"></div>
</div></header>
<main class="sx-main" id="main">
  <p class="sx-meta" id="meta" role="status" aria-live="polite"></p>
  <div id="out"></div>
</main>
<script src="search-index.js"></script>
<script>
(function () {
  var D = window.HLD_SEARCH || [];
  var q = document.getElementById('q'), out = document.getElementById('out'), meta = document.getElementById('meta'), chipsEl = document.getElementById('chips');
  var SCOPES = [['all', 'All'], ['Handbook', 'Handbook'], ['Quick Notes', 'Quick Notes'], ['Interview Book', 'Interview Book']];
  var CLS = { 'Handbook': 'handbook', 'Quick Notes': 'quick', 'Interview Book': 'interview' };
  var SUG = ['quorum', 'saga', 'token bucket', 'consistent hashing', 'CAP theorem', 'Kafka', 'JWT', 'HashMap', 'transaction isolation', 'circuit breaker'];
  var scope = 'all', shown = 0, PAGE = 30, results = [], sel = -1, timer = null, moreBtn = null;

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; }
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function terms() { return q.value.toLowerCase().split(/\s+/).filter(function (t) { return t.length > 1; }); }

  function score(r, ts, phrase) {
    var h = (r.h + ' ' + r.p).toLowerCase(), x = r.x.toLowerCase(), s = 0, i, t, inH, inX;
    for (i = 0; i < ts.length; i++) {
      t = ts[i]; inH = h.indexOf(t) >= 0; inX = x.indexOf(t) >= 0;
      if (!inH && !inX) return -1;
      s += (inH ? 6 : 0) + (inX ? 1 : 0);
      if (r.h && r.h.toLowerCase().indexOf(t) === 0) s += 3;
    }
    if (ts.length > 1) { if (h.indexOf(phrase) >= 0) s += 8; else if (x.indexOf(phrase) >= 0) s += 3; }
    if (!r.h) s += 1;
    return s;
  }

  function highlight(parent, text, ts) {
    if (!ts.length) { parent.appendChild(document.createTextNode(text)); return; }
    var parts = text.split(new RegExp('(' + ts.map(esc).join('|') + ')', 'i')), i;
    for (i = 0; i < parts.length; i++) {
      if (!parts[i]) continue;
      if (i % 2 === 1) parent.appendChild(el('mark', null, parts[i]));
      else parent.appendChild(document.createTextNode(parts[i]));
    }
  }

  function snippet(x, ts) {
    var low = x.toLowerCase(), pos = -1, i, p;
    for (i = 0; i < ts.length; i++) { p = low.indexOf(ts[i]); if (p >= 0 && (pos < 0 || p < pos)) pos = p; }
    if (pos < 0) pos = 0;
    var start = Math.max(0, pos - 60), end = Math.min(x.length, start + 200);
    if (start > 0) { var sp = x.indexOf(' ', start); if (sp > 0 && sp < pos) start = sp + 1; }
    return (start > 0 ? '… ' : '') + x.slice(start, end) + (end < x.length ? ' …' : '');
  }

  function renderChips(counts) {
    chipsEl.textContent = '';
    SCOPES.forEach(function (s) {
      var b = el('button', null, s[1]); b.type = 'button';
      b.setAttribute('aria-pressed', scope === s[0] ? 'true' : 'false');
      if (counts) b.appendChild(el('span', null, String(counts[s[0]] || 0)));
      b.addEventListener('click', function () { scope = s[0]; run(); q.focus(); });
      chipsEl.appendChild(b);
    });
  }

  function emptyState(title, text) {
    var d = el('div', 'sx-empty'); d.appendChild(el('h2', null, title)); d.appendChild(el('div', null, text));
    var s = el('div', 'sx-sug');
    SUG.forEach(function (w) {
      var b = el('button', null, w); b.type = 'button';
      b.addEventListener('click', function () { q.value = w; run(); q.focus(); });
      s.appendChild(b);
    });
    d.appendChild(s); out.appendChild(d);
  }

  function addHits(from, to, ts) {
    var i, r, a, cr, t, sn;
    for (i = from; i < to; i++) {
      r = results[i].r;
      a = el('a', 'sx-hit ' + (CLS[r.g] || 'handbook')); a.href = r.u;
      cr = el('span', 'crumb'); cr.appendChild(el('span', 'tag', r.g));
      if (r.h) { cr.appendChild(document.createTextNode('/')); cr.appendChild(el('span', null, r.p)); }
      a.appendChild(cr);
      t = el('span', 'ttl'); highlight(t, r.h ? r.h : r.p, ts); a.appendChild(t);
      sn = el('span', 'snip'); highlight(sn, snippet(r.x, ts), ts); a.appendChild(sn);
      if (moreBtn) out.insertBefore(a, moreBtn); else out.appendChild(a);
    }
  }

  function run() {
    var ts = terms(), phrase = ts.join(' ');
    sel = -1; out.textContent = ''; moreBtn = null;
    var v = q.value.trim();
    try { history.replaceState(null, '', location.pathname + (v ? '?q=' + encodeURIComponent(v) + (scope !== 'all' ? '&s=' + encodeURIComponent(scope) : '') : '')); } catch (e) {}
    if (!ts.length) {
      renderChips(null); meta.textContent = ''; results = [];
      emptyState('Search the whole site', 'Type at least 2 letters. Try one of these:'); return;
    }
    var all = [], counts = { all: 0, 'Handbook': 0, 'Quick Notes': 0, 'Interview Book': 0 };
    D.forEach(function (r) {
      var s = score(r, ts, phrase);
      if (s < 0) return;
      counts.all++; counts[r.g] = (counts[r.g] || 0) + 1;
      all.push({ r: r, s: s });
    });
    renderChips(counts);
    results = all.filter(function (o) { return scope === 'all' || o.r.g === scope; });
    results.sort(function (a, b) { return b.s - a.s; });
    meta.textContent = results.length + ' result' + (results.length === 1 ? '' : 's') + ' for “' + v + '”' + (scope !== 'all' ? ' in ' + scope : '');
    if (!results.length) { emptyState('Nothing found', 'Try a shorter word, a different spelling, or search all sections.'); return; }
    moreBtn = el('button', 'sx-more', 'Show more'); moreBtn.type = 'button';
    moreBtn.addEventListener('click', function () {
      var n = Math.min(results.length, shown + PAGE); addHits(shown, n, ts); shown = n;
      if (shown >= results.length) moreBtn.style.display = 'none';
    });
    out.appendChild(moreBtn);
    shown = Math.min(results.length, PAGE); addHits(0, shown, ts);
    if (shown >= results.length) moreBtn.style.display = 'none';
  }

  function hits() { return out.querySelectorAll('a.sx-hit'); }
  function select(n) {
    var h = hits(); if (!h.length) return;
    if (sel >= 0 && h[sel]) h[sel].classList.remove('sel');
    sel = (n + h.length) % h.length; h[sel].classList.add('sel');
    h[sel].scrollIntoView({ block: 'nearest' });
  }

  q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(run, 120); });
  q.addEventListener('keydown', function (e) {
    var h;
    if (e.key === 'ArrowDown') { e.preventDefault(); select(sel + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); select(sel - 1); }
    else if (e.key === 'Enter') { h = hits(); if (sel >= 0 && h[sel]) location.href = h[sel].href; else if (h[0]) location.href = h[0].href; }
    else if (e.key === 'Escape') { q.value = ''; run(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q && !e.ctrlKey && !e.metaKey) { e.preventDefault(); q.focus(); q.select(); }
  });
  q.addEventListener('focus', function () { document.getElementById('hint').style.visibility = 'hidden'; });
  q.addEventListener('blur', function () { document.getElementById('hint').style.visibility = 'visible'; });

  var P = new URLSearchParams(location.search);
  if (P.get('s') && CLS[P.get('s')]) scope = P.get('s');
  if (P.get('q')) q.value = P.get('q');
  run(); q.focus();
})();
</script>
</body>
</html>
