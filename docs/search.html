<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search | HLD</title>
<link rel="stylesheet" href="handbook/assets/style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
.sr{max-width:860px;margin:0 auto;padding:40px 22px 90px}
.sr input{width:100%;box-sizing:border-box;font-size:1.15rem;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.sr .meta{color:var(--muted);margin:10px 0 18px;font-size:14px}
.sr .hit{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0;text-decoration:none;color:var(--fg);background:var(--card)}
.sr .hit:hover{border-color:var(--accent)}
.sr .hit b{display:block;font-size:1.05rem}
.sr .hit small{color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.sr .hit span{display:block;color:var(--muted);font-size:14px;margin-top:4px}
</style>
</head>
<body data-page="search">
<main class="sr" id="main">
<p><a href="index.html">&larr; HLD home</a> | <a href="handbook/index.html">Handbook</a> | <a href="quicknotes/index.html">Quick Notes</a> | <a href="handbook/reference/ref-glossary.html">Glossary</a></p>
<h1>Search</h1>
<input id="q" type="search" placeholder="Search every chapter, case study and quick sheet, e.g. quorum, saga, token bucket" aria-label="Search">
<div class="meta" id="meta" role="status" aria-live="polite">Type at least 2 letters.</div>
<div id="out"></div>
</main>
<script src="search-index.js" defer></script>
<script>
(function () {
  var D = window.HLD_SEARCH || [], q = document.getElementById('q'), out = document.getElementById('out'), meta = document.getElementById('meta');
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; }
  function run() {
    var terms = q.value.toLowerCase().split(/\s+/).filter(function (t) { return t.length > 1; });
    out.textContent = '';
    if (!terms.length) { meta.textContent = 'Type at least 2 letters.'; return; }
    var res = [];
    D.forEach(function (r) {
      var h = (r.h + ' ' + r.p).toLowerCase(), x = r.x.toLowerCase(), s = 0, ok = true;
      terms.forEach(function (t) {
        var inH = h.indexOf(t) >= 0, inX = x.indexOf(t) >= 0;
        if (!inH && !inX) ok = false; else s += (inH ? 5 : 0) + (inX ? 1 : 0);
      });
      if (ok) res.push({ r: r, s: s + (r.h ? 0 : 1) });
    });
    res.sort(function (a, b) { return b.s - a.s; });
    meta.textContent = res.length + ' result' + (res.length === 1 ? '' : 's') + (res.length > 60 ? ' (showing the best 60)' : '');
    res.slice(0, 60).forEach(function (o) {
      var a = el('a', 'hit'); a.href = o.r.u;
      a.appendChild(el('small', null, o.r.g));
      a.appendChild(el('b', null, o.r.h ? o.r.p + ': ' + o.r.h : o.r.p));
      a.appendChild(el('span', null, o.r.x.slice(0, 190) + (o.r.x.length > 190 ? '…' : '')));
      out.appendChild(a);
    });
  }
  q.addEventListener('input', run);
  var m = /[?&]q=([^&]*)/.exec(location.search);
  if (m) { try { q.value = decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { q.value = m[1]; } run(); }
})();
</script>
</body>
</html>
